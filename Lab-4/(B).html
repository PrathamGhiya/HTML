<!DOCTYPE html>
<html>

<head>
    <title></title>
</head>

<body>
    <h1 align="center">Employee Registration</h1>
    <form action="">
        <table cellspacing="5" cellpadding="10" align="center">
            <tr>
                <th colspan="4">Personal Information</th>
            </tr>
            <tr align="center">
                <td><label for="">Employee Id : </label></td>
                <td><input type="text" placeholder="Enter Employee Id" required></td>
                <td><label for="">Employee Name : </label></td>
                <td><input type="text" placeholder="Enter Employee Name" required></td>
            </tr>
            <tr>
                <td><label for="">Email : </label></td>
                <td><input type="email" placeholder="Enter Email" required></td>
                <td><label for="">Contact No : </label></td>
                <td><input type="tel" pattern="[0-9]{10}" placeholder="Enter Contact No" required></td>
            </tr>
            <tr>
                <td><label for="">Marital Status : </label></td>
                <td>
                    <input type="radio" name="marital" required>
                    <label for="">Single</label>
                    <input type="radio" name="marital">
                    <label for="">Married</label>
                </td>
            </tr>
            <tr>
                <th colspan="4">Education Qualification</th>
            </tr>
            <tr>
                <td><label for="">Education : </label></td>
                <td><input type="text" placeholder="Enter Education details" required></td>
                <td><label for="">Experience : </label></td>
                <td><input type="text" placeholder="Enter Experience details" required></td>
            </tr>
            <tr>
                <th colspan="4">Job Details</th>
            </tr>
            <tr>
                <td><label for="">Designation : </label></td>
                <td><input type="text" placeholder="Enter Designation details" required></td>
                <td><label for="">Job Location : </label></td>
                <td><input type="text" placeholder="Enter Job Location" required></td>
            </tr>
            <tr>
                <td><label for="">Salary : </label></td>
                <td><input type="text" placeholder="Enter Salary details" required></td>
            </tr>
        </table>
        <hr>
        <center>
            <input type="submit" value="Register">
        </center>
    </form>
</body>

</html>
