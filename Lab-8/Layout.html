<!DOCTYPE html>
<html>

<head>
    <title>Web Page</title>
    <style>
        .page {
            background-color: aqua;
            padding: 10px;
            width: auto;
            margin: 15px auto;
        }

        header {
            color: white;
            background-color: crimson;
        }
        main{
            margin: 5px;
        }

        .sec {
            background-color: orange;
        }

        .area {
            margin: 5px;
            margin-bottom: 90px;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .entries {
            width: 65%;
        }

        .entry {
            background-color: black;
            color: white;
            margin-bottom: 10px;
            margin-left: 5px;
            padding-bottom: 5px;
        }

        .slidebar {
            background-color: black;
            color: white;
            height: 70px;
            width: 300px;
            width: 25%;
            padding: 10px;
        }

        footer {
            color: white;
            background-color: blue;
        }
    </style>
</head>

<body>

    <div class="page">
        <span>Page</span>

        <section class="sec">
            <header>
                <span>Header</span>
            </header>
            <main>
                <span>Content</span>
                <div class="area">

                    <div class="entries">
                        <div class="entry">Entry</div>
                        <div class="entry">Entry</div>
                        <div class="entry">Entry</div>
                    </div>
                    <div class="slidebar">
                        <div>Slidebar</div>
                    </div>
                </div>
            </main>

            <footer>
                <span>&copy;Darshan University-Rajkot </span>
            </footer>
        </section>
    </div>

</body>

</html>
